[project]
name = "ai-skin-specialist"
version = "0.1.0"
description = "AI-powered skin consultation assistant that analyzes photos, videos, and voice descriptions to provide preliminary skin care guidance with a spoken response."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.0",
    "deepgram-sdk>=7.6.0",
    "google-genai>=2.14.0",
    "gradio>=6.20.0",
    "groq>=1.6.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.2",
    "speechrecognition>=3.17.0",
]
